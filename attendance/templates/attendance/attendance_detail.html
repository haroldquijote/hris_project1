<h1>Attendance Details</h1>

<p><strong>Employee:</strong> {{ attendance.employee }}</p>
<p><strong>Date:</strong> {{ attendance.date }}</p>
<p><strong>Time In:</strong> {{ attendance.time_in|default:'-' }}</p>
<p><strong>Time Out:</strong> {{ attendance.time_out|default:'-' }}</p>

<p>
    <a href="{% url 'attendance_update' attendance.pk %}">Edit</a> |
    <a href="{% url 'attendance_delete' attendance.pk %}">Delete</a> |
    <a href="{% url 'attendance_list' %}">Back to list</a>
</p>
