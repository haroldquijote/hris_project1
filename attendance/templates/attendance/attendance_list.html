<h1>Attendance List</h1>

<p><a href="{% url 'attendance_create' %}">Add Attendance</a></p>

{% for attendance in attendances %}
    <p>
        <a href="{% url 'attendance_detail' attendance.pk %}">
            {{ attendance.employee }} - {{ attendance.date }}
        </a>
        | <a href="{% url 'attendance_update' attendance.pk %}">Edit</a>
        | <a href="{% url 'attendance_delete' attendance.pk %}">Delete</a>
    </p>
{% empty %}
    <p>No attendance records found.</p>
{% endfor %}
