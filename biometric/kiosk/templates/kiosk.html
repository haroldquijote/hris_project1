<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Terminal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px;
            transition: background 0.3s ease;
        }

        .screen.idle    { background: linear-gradient(135deg, #1e293b, #0f172a); }
        .screen.success { background: linear-gradient(135deg, #065f46, #10b981); }
        .screen.error   { background: linear-gradient(135deg, #7f1d1d, #dc2626); }
        .screen.warning { background: linear-gradient(135deg, #78350f, #f59e0b); }

        .icon {
            font-size: 8rem;
            margin-bottom: 40px;
            line-height: 1;
        }

        .title {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 1.5rem;
            opacity: 0.85;
        }

        .clock, .company {
            position: fixed;
            font-size: 1.25rem;
            opacity: 0.6;
            letter-spacing: 0.05em;
        }
        .clock   { bottom: 40px; }
        .company { top: 40px; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.7; transform: scale(0.98); }
        }
        .screen.idle .icon { animation: pulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="company">PHILIPPINE HOME PHARMACEUTICAL</div>

    <div id="screen" class="screen idle">
        <div class="icon" id="icon">☝️</div>
        <div class="title" id="title">Place your finger</div>
        <div class="subtitle" id="subtitle">on the scanner below</div>
    </div>

    <div class="clock" id="clock">--:--:--</div>

    <script>
        let lastEventId = 0;
        let resetTimer = null;

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText =
                now.toLocaleTimeString('en-US', { hour12: true });
        }
        setInterval(updateClock, 1000);
        updateClock();

        setInterval(async () => {
            try {
                const res = await fetch('/api/last-scan');
                const data = await res.json();
                if (data.event_id && data.event_id !== lastEventId) {
                    lastEventId = data.event_id;
                    showState(data);
                }
            } catch (e) {}
        }, 500);

        function showState(data) {
            const screen = document.getElementById('screen');
            const icon = document.getElementById('icon');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');

            if (resetTimer) clearTimeout(resetTimer);
            screen.className = 'screen ' + (data.status || 'idle');

            if (data.status === 'success') {
                icon.innerText = '✓';
                title.innerText = data.employee || 'Recorded';
                subtitle.innerText = data.message || '';
            } else if (data.status === 'error') {
                icon.innerText = '✗';
                title.innerText = 'Not recognized';
                subtitle.innerText = 'Wipe your finger and try again';
            } else if (data.status === 'warning') {
                icon.innerText = '⏱';
                title.innerText = data.employee || 'Already recorded';
                subtitle.innerText = data.message || '';
            }

            resetTimer = setTimeout(() => {
                screen.className = 'screen idle';
                icon.innerText = '☝️';
                title.innerText = 'Place your finger';
                subtitle.innerText = 'on the scanner below';
            }, 3000);
        }
    </script>
</body>
</html>
