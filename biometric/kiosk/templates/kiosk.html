<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Terminal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fb;
            color: #243247;
            height: 100vh;
            overflow: hidden;
        }

        .terminal-container {
            width: fit-content;
            max-width: calc(100% - 32px);
            min-height: auto;
            margin: 0 auto;
            padding: 24px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            border: 1px solid #d8e2f1;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(38, 61, 99, 0.08);
        }

        .screen {
            width: 100%;
            min-height: auto;
            height: auto;
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            transition: background 0.3s ease;
        }

        .screen.idle {
            background: #f5f7fb;
            border-radius: 16px;
            padding: 30px 35px;
        }

        .screen.success {
            background: #ecfdf3;
        }

        .screen.error {
            background: #fff1f2;
        }

        .screen.warning {
            background: #fff8e8;
        }

        .screen .icon {
            width: 148px;
            height: 148px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            border-radius: 50%;
            background: #e8eef8;
            color: #405b8d;
            border: 1px solid #d8e2f1;
            font-size: 5.5rem;
            line-height: 1;
            box-shadow: 0 8px 24px rgba(38, 61, 99, 0.08);
            overflow: hidden;
        }

        /* SVG icons fill the circular frame */
        .screen .icon svg {
            width: 65%;
            height: 65%;
            display: block;
        }

        .screen.success .icon {
            background: #dcfce7;
            border-color: #bbf7d0;
            color: #15803d;
        }

        .screen.error .icon {
            background: #ffe4e6;
            border-color: #fecdd3;
            color: #be123c;
        }

        .screen.warning .icon {
            background: #fef3c7;
            border-color: #fde68a;
            color: #b45309;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #243247;
            margin-bottom: 14px;
            letter-spacing: -0.03em;
        }

        .subtitle {
            font-size: 1.15rem;
            line-height: 1.6;
            color: #68758a;
            max-width: 620px;
        }

        .screen.success .title {
            color: #166534;
        }

        .screen.error .title {
            color: #9f1239;
        }

        .screen.warning .title {
            color: #92400e;
        }

        .clock-background {
            position: static;
            transform: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #405b8d;
            color: rgb(216, 212, 212);
            padding: 9px 24px;
            border-radius: 10px;
            font-size: 0.90rem;
            font-weight: 600;
        }

        .clock {
            position: static;
            text-align: center;
            color: rgb(216, 212, 212);
            font-variant-numeric: tabular-nums;
            font-size: 2rem;
            letter-spacing: 0.04em;
        }

        .company {
            position: static;
            width: 100%;
            text-align: center;
            color: #405b8d;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 20px;
            margin-bottom: 50px;
        }

        .company-subtitle {
            margin-top: 5px;
            color: #90a3c7;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 8px 24px rgba(38, 61, 99, 0.08);
            }
            50% {
                transform: scale(0.98);
                box-shadow: 0 5px 16px rgba(38, 61, 99, 0.05);
            }
        }

        .screen.idle .icon {
            animation: pulse 2s ease-in-out infinite;
        }
        
                /* ── Enroll access button (gear icon, top-right) ───────────── */
        .enroll-access {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(64, 91, 141, 0.08);
            border: 1px solid rgba(64, 91, 141, 0.15);
            color: #405b8d;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s, background 0.2s;
        }

        .enroll-access:hover {
            opacity: 1;
            background: rgba(64, 91, 141, 0.15);
        }

        .enroll-access svg {
            width: 22px;
            height: 22px;
        }

        /* ── PIN modal overlay ─────────────────────────────────────── */
        .pin-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .pin-overlay.active {
            display: flex;
        }

        .pin-modal {
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(15, 23, 42, 0.25);
            text-align: center;
        }

        .pin-modal h2 {
            font-size: 1.4rem;
            color: #243247;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .pin-modal p {
            color: #68758a;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .pin-input {
            width: 100%;
            padding: 14px 20px;
            font-size: 2rem;
            text-align: center;
            letter-spacing: 12px;
            border: 2px solid #d8e2f1;
            border-radius: 10px;
            margin-bottom: 16px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .pin-input:focus {
            outline: none;
            border-color: #405b8d;
            box-shadow: 0 0 0 4px rgba(64, 91, 141, 0.12);
        }

        .pin-error {
            color: #be123c;
            font-size: 0.85rem;
            min-height: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .pin-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .pin-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel {
            background: #e8eef8;
            color: #405b8d;
        }

        .btn-cancel:hover {
            background: #dbe5f5;
        }

        .btn-verify {
            background: #405b8d;
            color: #ffffff;
        }

        .btn-verify:hover:not(:disabled) {
            background: #314873;
        }

        .btn-verify:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .screen {
                padding: 24px;
            }

            .screen .icon {
                width: 120px;
                height: 120px;
                margin-bottom: 24px;
            }

            .title {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .company {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="company">
        <div>PHILIPPINE HOME PHARMACEUTICAL</div>
        <div class="company-subtitle">Biometric Attendance Terminal</div>
    </div>

    <div class="terminal-container">
        <div class="clock-background">
            <div>Current Time</div>
            <div class="clock" id="clock">--:--:--</div>
        </div>

        <div id="screen" class="screen idle">
            <div class="icon" id="icon"></div>
            <div class="title" id="title">Ready to Scan</div>
            <div class="subtitle" id="subtitle">Place your registered finger on the scanner to record your attendance.</div>
        </div>
    </div>

        <!-- Enroll access — small gear icon top-right, opens PIN modal -->
    <button class="enroll-access" id="enroll-btn" aria-label="Enroll fingerprint" onclick="openPinModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </button>

    <!-- PIN entry modal -->
    <div class="pin-overlay" id="pin-overlay" onclick="closePinModalOnBackdrop(event)">
        <div class="pin-modal" onclick="event.stopPropagation()">
            <h2>HR Access</h2>
            <p>Enter PIN to manage fingerprint enrollment</p>

            <input
                type="password"
                id="pin-input"
                class="pin-input"
                inputmode="numeric"
                pattern="[0-9]*"
                maxlength="8"
                placeholder="••••"
                autocomplete="off"
                onkeydown="if (event.key === 'Enter') submitPin()"
            >

            <div class="pin-error" id="pin-error"></div>

            <div class="pin-actions">
                <button class="btn-cancel" onclick="closePinModal()">Cancel</button>
                <button class="btn-verify" id="pin-verify-btn" onclick="submitPin()">Verify</button>
            </div>
        </div>
    </div>

    <script>
        let lastEventId = 0;
        let resetTimer = null;

        // ── SVG icons (all states match the fingerprint design language) ──
        const ICONS = {
            idle: `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Fingerprint" role="img">
                    <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
                        <path d="M50 13 C30 13 17 28 17 47"/>
                        <path d="M50 22 C35 22 26 33 26 48"/>
                        <path d="M50 31 C40 31 35 39 35 49"/>
                        <path d="M50 40 C46 40 44 44 44 50"/>
                        <path d="M50 13 C70 13 83 28 83 47"/>
                        <path d="M50 22 C65 22 74 33 74 48"/>
                        <path d="M50 31 C60 31 65 39 65 49"/>
                        <path d="M50 40 C54 40 56 44 56 50"/>
                        <path d="M17 54 C18 73 28 85 40 91"/>
                        <path d="M26 56 C27 70 33 79 42 84"/>
                        <path d="M35 57 C36 66 40 73 46 77"/>
                        <path d="M83 54 C82 73 72 85 60 91"/>
                        <path d="M74 56 C73 70 67 79 58 84"/>
                        <path d="M65 57 C64 66 60 73 54 77"/>
                        <path d="M50 49 C49 62 50 72 50 80"/>
                    </g>
                </svg>`,

            success: `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Success" role="img">
                    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M26 52 L44 70 L76 32"/>
                    </g>
                </svg>`,

            error: `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Error" role="img">
                    <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M32 32 L68 68"/>
                        <path d="M68 32 L32 68"/>
                    </g>
                </svg>`,

            warning: `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Already Recorded" role="img">
                    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="50" cy="50" r="30"/>
                        <path d="M50 32 L50 52 L64 60"/>
                    </g>
                </svg>`,
        };

        const DEFAULT_TITLE = 'Ready to Scan';
        const DEFAULT_SUBTITLE = 'Place your registered finger on the scanner to record your attendance.';

        // ── Live clock ────────────────────────────────────────────────
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText =
                now.toLocaleTimeString('en-US', { hour12: true });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // ── Poll backend for scan events ──────────────────────────────
        setInterval(async () => {
            try {
                const res = await fetch('/api/last-scan');
                const data = await res.json();
                if (data.event_id && data.event_id !== lastEventId) {
                    lastEventId = data.event_id;
                    showState(data);
                }
            } catch (e) {
                // Backend offline — kiosk stays on idle, no crash
            }
        }, 500);

        // ── Render scan event ─────────────────────────────────────────
        function showState(data) {
            const screen = document.getElementById('screen');
            const icon = document.getElementById('icon');
            const title = document.getElementById('title');
            const subtitle = document.getElementById('subtitle');

            if (resetTimer) clearTimeout(resetTimer);

            const state = data.status || 'idle';
            screen.className = 'screen ' + state;
            icon.innerHTML = ICONS[state] || ICONS.idle;

            if (state === 'success') {
                title.innerText = data.employee || 'Attendance Recorded';
                subtitle.innerText = data.message || '';

            } else if (state === 'error') {
                title.innerText = 'Scan Not Accepted';
                subtitle.innerText = data.message || 'Please try again or contact HR.';

            } else if (state === 'warning') {
                title.innerText = data.employee || 'Already Recorded';
                subtitle.innerText = data.message || '';

            } else {
                title.innerText = DEFAULT_TITLE;
                subtitle.innerText = DEFAULT_SUBTITLE;
            }

            // Reset back to idle after 3 seconds
            resetTimer = setTimeout(() => {
                screen.className = 'screen idle';
                icon.innerHTML = ICONS.idle;
                title.innerText = DEFAULT_TITLE;
                subtitle.innerText = DEFAULT_SUBTITLE;
            }, 3000);
        }

                // ── PIN modal for enroll access ──────────────────────────────
        function openPinModal() {
            const overlay = document.getElementById('pin-overlay');
            const input = document.getElementById('pin-input');
            const error = document.getElementById('pin-error');

            input.value = '';
            error.innerText = '';
            overlay.classList.add('active');

            // Focus after DOM updates
            setTimeout(() => input.focus(), 50);
        }

        function closePinModal() {
            document.getElementById('pin-overlay').classList.remove('active');
            document.getElementById('pin-input').value = '';
            document.getElementById('pin-error').innerText = '';
        }

        function closePinModalOnBackdrop(event) {
            if (event.target.id === 'pin-overlay') {
                closePinModal();
            }
        }

        async function submitPin() {
            const input = document.getElementById('pin-input');
            const error = document.getElementById('pin-error');
            const btn = document.getElementById('pin-verify-btn');
            const pin = input.value.trim();

            if (!pin) {
                error.innerText = 'Please enter a PIN';
                return;
            }

            btn.disabled = true;
            btn.innerText = 'Verifying...';
            error.innerText = '';

            try {
                const res = await fetch('/api/enroll/verify-pin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin }),
                });

                const data = await res.json();

                if (res.ok && data.ok) {
                    // Success — navigate to enrollment page (same window)
                    window.location.href = '/enroll';
                } else {
                    error.innerText = data.error || 'Invalid PIN';
                    input.value = '';
                    input.focus();
                }
            } catch (e) {
                error.innerText = 'Server unreachable. Please try again.';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Verify';
            }
        }
        
        // ── Load the idle icon on page open ───────────────────────────
        document.getElementById('icon').innerHTML = ICONS.idle;
    </script>
</body>
</html>
